<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성과노트</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성과노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B1F" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column, like a single planner page. Today's seal on top (the one bold element),
   the week as seven small seals, then the checklist you tap. Writing is kept to one line, once. */
:root {
  --paper: #EEF2EC;      /* 모눈종이 */
  --sheet: #F8FAF6;      /* 펼친 면 */
  --grid: #DFE7E1;       /* 방안 선, 일부러 흐리게 */
  --ink: #233A9E;        /* 청색 볼펜 */
  --seal: #C62828;       /* 인주 */
  --graphite: #2F3336;
  --muted: #6B736B;
  --line: #CCD7CF;
  --seal-soft: rgba(198, 40, 40, .08);
  --ink-soft: rgba(35, 58, 158, .08);
  /* category colors, validated as an adjacent-pair categorical set on --sheet */
  --heat: var(--seal);   /* one-year grid hue; the settings tab can swap it */
  --h0: var(--line); --h1: color-mix(in oklab, var(--heat) 28%, var(--sheet)); --h2: color-mix(in oklab, var(--heat) 52%, var(--sheet));
  --h3: color-mix(in oklab, var(--heat) 76%, var(--sheet)); --h4: var(--heat);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c0: #9aa29a;
  --display: "Hahmlet", "Noto Serif KR", "Batang", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --step--1: .8125rem; --step-0: 1rem; --step-1: 1.1875rem; --step-2: 1.5rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #171B1F; --sheet: #1D2227; --grid: #222A25; --ink: #9DB0FF; --seal: #F0605A;
  --graphite: #E3E7E1; --muted: #9AA298; --line: #343E36; --seal-soft: rgba(240, 96, 90, .12); --ink-soft: rgba(157, 176, 255, .1); --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #6b736b; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #171B1F; --sheet: #1D2227; --grid: #222A25; --ink: #9DB0FF; --seal: #F0605A;
  --graphite: #E3E7E1; --muted: #9AA298; --line: #343E36; --seal-soft: rgba(240, 96, 90, .12); --ink-soft: rgba(157, 176, 255, .1); --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #6b736b; color-scheme: dark }

* { box-sizing: border-box }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--graphite); font-family: var(--body); font-size: var(--step-0); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px calc(96px + env(safe-area-inset-bottom, 0px)); word-break: keep-all; overflow-wrap: anywhere;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance }
p { margin: 0 }
button, input { font: inherit; color: inherit }
button { -webkit-tap-highlight-color: transparent }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.page { background: var(--sheet); border: 1px solid var(--line); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0 }

/* today */
.today { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center }
.big-seal {
  width: 112px; aspect-ratio: 1; border-radius: 50%; color: var(--seal);
  border: 3px solid var(--seal); box-shadow: inset 0 0 0 3px var(--sheet), inset 0 0 0 5px var(--seal);
  display: grid; place-items: center; align-content: center; transform: rotate(-7deg); filter: url(#rough);
}
.big-seal.zero { border-style: dashed; border-width: 2px; box-shadow: none; color: var(--muted); filter: none }
.big-seal b { font-family: var(--display); font-weight: 800; font-size: 2.75rem; line-height: 1; font-variant-numeric: tabular-nums; display: block }
.big-seal small { font-size: .6875rem; font-weight: 600; line-height: 1.2; margin-top: 4px }
.today h1 { font-size: var(--step-2); font-weight: 700; letter-spacing: -.015em; line-height: 1.3 }
.today .msg { color: var(--muted); margin-top: 4px }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center }
.day { display: grid; gap: 4px; justify-items: center; font-size: var(--step--1); color: var(--muted) }
.day .s {
  width: 34px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: .875rem; color: var(--seal); position: relative;
}
.day .s.on { border: 2px solid var(--seal); transform: rotate(var(--r)); filter: url(#rough) }
.day .s:not(.on)::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--line) }
button.day { background: none; border: 0; padding: 4px 0; font: inherit; color: inherit; cursor: pointer; border-radius: 10px; transition: transform 120ms var(--ease-out) }
button.day:active:not(:disabled) { transform: scale(.94) }
button.day:disabled { cursor: default }
.day.is-today { color: var(--ink); font-weight: 600 }
.day.is-sel .s { outline: 2px solid var(--ink); outline-offset: 2px }
.day.later { opacity: .45 }

/* checklist */
.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
.list-head h2 { font-size: var(--step-1); font-weight: 700 }
.count { color: var(--muted); font-size: var(--step--1); font-variant-numeric: tabular-nums }
.text-btn {
  background: none; border: 0; padding: 6px 4px; color: var(--ink); cursor: pointer; font-size: var(--step--1); font-weight: 500;
  border-radius: 6px; transition: background-color 150ms ease;
}
.checks { list-style: none; margin: 0; padding: 0; display: grid }
.checks li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line) }
.box-btn {
  flex: none; width: 44px; height: 48px; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer;
  border-radius: 8px; transition: transform 120ms var(--ease-out);
}
.box-btn:active { transform: scale(.92) }
.box {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center;
  transition: border-color 150ms ease;
}
.box svg { width: 30px; height: 30px; overflow: visible; opacity: 0 }
.box-btn[aria-pressed="true"] .box { border-color: transparent }
.box-btn[aria-pressed="true"] .box svg { opacity: 1 }
.title-btn {
  flex: 1; min-width: 0; background: none; border: 0; padding: 12px 4px; text-align: left; cursor: pointer; border-radius: 8px;
  transition: background-color 150ms ease;
}
.txt { display: grid; gap: 2px; min-width: 0 }
.txt span { font-size: 1.0625rem; line-height: 1.45; color: var(--graphite); transition: color 150ms ease }
.is-done .txt span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--seal); text-decoration-thickness: 1.5px }
.checks li { gap: 4px }
.checks li.editing { display: block; border-bottom: 0 }
.checks li.editing .cat-add { margin: 6px 0 }
.form-foot { display: flex; justify-content: flex-end }
.cat-edit-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.rep { font-size: .75rem; color: var(--ink); font-weight: 500 }
.rep.once { color: var(--muted); font-weight: 400 }
.del {
  background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
  color: var(--seal); font-size: var(--step--1); transition: transform 120ms var(--ease-out);
}
.del:active { transform: scale(.96) }
.checks .empty { display: block; padding: 16px 4px; color: var(--muted); border-bottom: 0 }
.all-done { color: var(--seal); font-family: var(--display); font-weight: 700; font-size: var(--step-1) }

/* categories */
.cats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px }
.cat { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0 }
.cat-head { display: flex; align-items: center; gap: 2px; border-bottom: 2px solid var(--graphite) }
.cat-toggle {
  flex: none; width: 28px; height: 36px; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 6px;
}
.cat-toggle::before {
  content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: translateY(-2px) rotate(45deg); transition: transform 180ms var(--ease-out);
}
.cat-toggle[aria-expanded="false"]::before { transform: rotate(-45deg) }
.cat-title {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 8px 4px;
  cursor: pointer; text-align: left; border-radius: 6px; transition: background-color 150ms ease;
}
.cat-name { font-family: var(--display); font-weight: 700; font-size: 1.0625rem; min-width: 0 }
.cat-count { color: var(--muted); font-size: var(--step--1); font-variant-numeric: tabular-nums }
.cat-count.full { color: var(--seal); font-weight: 600 }
.cat-rename { width: 0;
  flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed var(--ink); border-radius: 0;
  padding: 8px 4px; font-family: var(--display); font-weight: 700; font-size: 1.0625rem; color: var(--ink);
}
.cat-rename:focus { outline: none; border-bottom-style: solid }
.cat-body[hidden] { display: none }
.cat .quiet { color: var(--muted); font-size: var(--step--1); padding: 10px 4px 0 }
.cat-add {
  display: grid; gap: 10px; margin: 8px 0 4px; padding: 12px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
}
.cat-add input {
  width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 2px;
  font-size: 1.0625rem; color: var(--ink); transition: border-color 150ms ease, box-shadow 150ms ease;
}
.cat-add input::placeholder { color: var(--muted); opacity: .8 }
.cat-add input:focus { outline: none; border-bottom-color: var(--ink); box-shadow: 0 1px 0 var(--ink) }
.rep-label { font-size: var(--step--1); color: var(--graphite); font-weight: 500; margin-bottom: -4px }
.rep-label span { color: var(--muted); font-weight: 400; margin-left: 6px }
.add-actions { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.5fr) auto; gap: 4px; align-items: center }
.day-btn {
  height: 34px; min-width: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer;
  font-size: var(--step--1); color: var(--graphite); white-space: nowrap;
  transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 120ms var(--ease-out);
}
.day-btn:active { transform: scale(.94) }
.day-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); font-weight: 600 }
.cat-add .btn { padding: 0 14px; height: 34px; margin-left: 4px }
.plus {
  /* sized and centred on the ink of the 17px Hahmlet title glyphs (about 15.4px tall, centre 1.5px below the line box centre) */
  flex: none; width: 15px; height: 15px; margin: 3px 6px 0 0; padding: 0; border-radius: 50%; border: 1.5px solid currentColor; background: var(--sheet); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; position: relative; transition: transform 160ms var(--ease-out), background-color 150ms ease;
}
.plus::after { content: ""; position: absolute; inset: -10px }
.plus svg { display: block; width: 9px; height: 9px; fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; transition: transform 180ms var(--ease-out) }
.plus[aria-expanded="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink) }
.plus[aria-expanded="true"] svg { transform: rotate(45deg) }
.plus:active { transform: scale(.94) }
.new-cat-btn {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--ink); background: none; color: var(--ink); border-radius: 999px;
  padding: 5px 12px 5px 8px; cursor: pointer; font-size: var(--step--1); font-weight: 600; transition: transform 120ms var(--ease-out), background-color 150ms ease;
}
.new-cat-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; transition: transform 180ms var(--ease-out) }
.new-cat-btn[aria-expanded="true"] { background: var(--ink); color: var(--sheet) }
.new-cat-btn[aria-expanded="true"] svg { transform: rotate(45deg) }
.new-cat-btn:active { transform: scale(.96) }
.newcat[hidden] { display: none }
.list-foot { display: flex; justify-content: flex-end }
.newcat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding-top: 4px }
.newcat input {
  width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 0;
  font-size: 1rem; color: var(--graphite); transition: border-color 150ms ease, box-shadow 150ms ease;
}
.newcat input:focus { outline: none; border-bottom-color: var(--ink); box-shadow: 0 1px 0 var(--ink) }
.btn-line:disabled { opacity: .4; cursor: not-allowed }
.del { flex: none; max-width: 60% }
.del.armed { background: var(--seal); color: var(--sheet); border-color: var(--seal) }

/* add */
.add { display: grid; gap: 10px; padding-top: 4px }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px }
.add input {
  width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 0;
  font-size: 1.0625rem; color: var(--ink); transition: border-color 150ms ease, box-shadow 150ms ease;
}
.add input::placeholder { color: var(--muted); opacity: .75 }
.add input:focus { outline: none; border-bottom-color: var(--ink); box-shadow: 0 1px 0 var(--ink) }
.btn {
  background: var(--seal); color: var(--sheet); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
  font-family: var(--display); font-weight: 700; transition: transform 160ms var(--ease-out), opacity 150ms ease;
}
.btn:active:not(:disabled) { transform: scale(.97) }
.btn:disabled { opacity: .4; cursor: not-allowed }
.repeat { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: var(--step--1); color: var(--muted) }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 14px; cursor: pointer;
  font-size: var(--step--1); transition: background-color 150ms ease, border-color 150ms ease, transform 120ms var(--ease-out);
}
.chip:active { transform: scale(.96) }
.chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet) }

/* app tab bar */
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px }
.view[hidden] { display: none }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--sheet); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.tabbar > div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px }
.tabbar button {
  display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 6px; border-radius: 12px; cursor: pointer;
  color: var(--muted); font-size: .75rem; font-weight: 500; transition: color 150ms ease, transform 120ms var(--ease-out);
}
.tabbar button:active { transform: scale(.96) }
.tabbar button[aria-selected="true"] { color: var(--seal); font-weight: 600 }
.tabbar svg { width: 24px; height: 24px }

/* settings */
#view-settings h2 { font-size: var(--step-1); font-weight: 700 }
.opt-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.opt {
  display: grid; justify-items: center; gap: 8px; padding: 12px 6px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--sheet);
  cursor: pointer; font-size: var(--step--1); color: var(--graphite); transition: border-color 150ms ease, transform 120ms var(--ease-out);
}
.opt:active { transform: scale(.97) }
.opt[aria-checked="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600 }
.opt-prev { width: 44px; height: 30px; border-radius: 6px; border: 1px solid var(--line) }
.opt-prev.lt { background: #F8FAF6 }
.opt-prev.dk { background: #1D2227 }
.opt-prev.sys { background: linear-gradient(135deg, #F8FAF6 50%, #1D2227 50%) }
.opt-list { display: grid; gap: 6px }
.backup-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.backup-row .opt { font-size: var(--step-0); padding: 14px 6px; color: var(--ink); font-weight: 600 }
#backupMsg:empty { display: none }
/* room to scroll the last category up above the keyboard */
body.typing { padding-bottom: 70vh }
.heat-opt {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--sheet);
  cursor: pointer; text-align: left; transition: border-color 150ms ease, transform 120ms var(--ease-out);
}
.heat-opt:active { transform: scale(.98) }
.heat-opt[aria-checked="true"] { border-color: var(--ink) }
.heat-opt .name { flex: 1; min-width: 0; font-size: var(--step-0) }
.heat-opt[aria-checked="true"] .name { font-weight: 600; color: var(--ink) }
.heat-opt .ramp { display: flex; gap: 3px }
.heat-opt .ramp i { width: 13px; height: 13px; border-radius: 3px }
.swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; justify-items: center }
.sw {
  width: 100%; max-width: 30px; aspect-ratio: 1; height: auto; border-radius: 50%; border: 0; cursor: pointer; padding: 0; position: relative;
  transition: transform 120ms var(--ease-out);
}
.sw:active { transform: scale(.92) }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--graphite) }
.sw-label { font-size: var(--step--1); color: var(--muted) }

/* charts */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px }
.seg button {
  border: 0; background: none; border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: var(--step--1); color: var(--muted);
  transition: background-color 150ms ease, color 150ms ease, transform 120ms var(--ease-out);
}
.seg button:active { transform: scale(.96) }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--sheet); font-weight: 500 }
.chart-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.chart-sum { color: var(--graphite); min-width: 0 }
.chart-sum b { font-family: var(--display); font-weight: 800; color: var(--seal); font-variant-numeric: tabular-nums }
.month-nav { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: var(--step-0); font-weight: 700; font-variant-numeric: tabular-nums }
.month-nav button {
  width: 32px; height: 32px; border: 1px solid var(--line); background: none; border-radius: 50%; cursor: pointer; font-size: 1.1rem; line-height: 1;
  color: var(--ink); transition: transform 120ms var(--ease-out);
}
.month-nav button:active:not(:disabled) { transform: scale(.94) }
.month-nav button:disabled { opacity: .3; cursor: not-allowed }
.chart { position: relative }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .base { stroke: var(--muted); stroke-width: 1 }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--body); font-variant-numeric: tabular-nums }
.chart .axis.cur { fill: var(--ink); font-weight: 600 }
.chart .val { fill: var(--graphite); font-size: 12px; font-weight: 600; font-family: var(--body); font-variant-numeric: tabular-nums }
.chart .col { transition: opacity 120ms ease; transform-box: fill-box; transform-origin: bottom }
.chart svg.hovering .col:not(.on) { opacity: .4 }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--step--1); color: var(--muted) }
.legend-row:empty { display: none }
.legend-row span, .tip-row { display: inline-flex; align-items: center; gap: 6px }
.legend-row i, .tip-row i, .cat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none }
.tip-row { display: flex; font-size: .75rem }
.cat-dot { align-self: center }
.chart .hit { fill: transparent; cursor: pointer }
.tip {
  position: absolute; top: 0; transform: translate(-50%, -100%); background: var(--graphite); color: var(--sheet);
  padding: 6px 10px; border-radius: 8px; font-size: var(--step--1); line-height: 1.4; white-space: nowrap; pointer-events: none;
}
.tip b { font-family: var(--display); font-weight: 800 }

/* one-year grid: one square per day, darker with more done (one hue, light to dark) */
.heat-wrap { overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin }
.heat { position: relative; display: grid; grid-template-columns: 24px; grid-auto-columns: 13px; grid-template-rows: 16px repeat(7, 13px); gap: 3px; width: max-content }
.heat .ml { font-size: .6875rem; color: var(--muted); white-space: nowrap; align-self: end; line-height: 1 }
.heat .dl {
  position: sticky; left: 0; z-index: 1; background: var(--sheet); font-size: .6875rem; color: var(--muted);
  line-height: 13px; margin-right: -3px; padding-right: 3px; box-shadow: 3px 0 0 var(--sheet);
}
.heat .c { border-radius: 3px; background: var(--h0); cursor: pointer }
.heat .c.now { outline: 1.5px solid var(--ink); outline-offset: 1px }
.heat .c.on { outline: 2px solid var(--graphite); outline-offset: 1px }
.heat .tip { white-space: nowrap; z-index: 2 }
.heat-legend { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: .75rem; color: var(--muted) }
.heat-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block }
.heat-legend i:first-child { margin-left: 4px } .heat-legend i:last-child { margin-right: 4px }
.h0 { background: var(--h0) } .h1 { background: var(--h1) } .h2 { background: var(--h2) } .h3 { background: var(--h3) } .h4 { background: var(--h4) }
.heat .c.h1 { background: var(--h1) } .heat .c.h2 { background: var(--h2) } .heat .c.h3 { background: var(--h3) } .heat .c.h4 { background: var(--h4) }

/* done log */

details summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
details summary::-webkit-details-marker { display: none }
details summary h2 { font-size: var(--step-1); font-weight: 700 }
details summary .count::after { content: " 펼치기" }
details[open] summary .count::after { content: " 접기" }
.log { display: grid; gap: 14px; margin-top: 14px }
.log h3 { margin: 0; font-size: var(--step--1); color: var(--muted); font-weight: 500 }
.log ul { margin: 4px 0 0; padding-left: 1.1em; display: grid; gap: 2px }
.log li::marker { color: var(--seal) }
.copy-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px }
.btn-line {
  background: transparent; border: 1px solid var(--ink); color: var(--ink); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 500;
  display: inline-grid; transition: transform 160ms var(--ease-out), background-color 150ms ease;
}
.btn-line:active { transform: scale(.97) }
.btn-line > span { grid-area: 1 / 1; text-align: center; transition: opacity 200ms ease, filter 200ms ease }
.btn-line > span[aria-hidden="true"] { opacity: 0; filter: blur(2px) }
.note { font-size: var(--step--1); color: var(--muted) }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
#copySrc { position: absolute; left: -9999px; width: 1px; height: 1px }

@media (hover: hover) and (pointer: fine) {
  .title-btn:hover, .cat-title:hover, .cat-toggle:hover { background: var(--ink-soft) }
  .text-btn:hover { background: var(--ink-soft) }
  .btn:not(:disabled):hover { filter: brightness(1.08) }
  .btn-line:hover, .chip:hover { background-color: var(--ink-soft) }
  .chip[aria-checked="true"]:hover { background: var(--ink) }
}
@media (max-width: 420px) {
  .today { gap: 14px }
  .big-seal { width: 92px }
  .big-seal b { font-size: 2.25rem }
  .day .s { width: 30px }
}

<style>
/* home-screen app: keep content clear of the notch, and stop iOS from zooming or bouncing text */
body { padding-top: calc(24px + env(safe-area-inset-top, 0px)); -webkit-text-size-adjust: 100%; overscroll-behavior-y: none }
input { font-size: max(16px, 1em) }
</style>

<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
  </filter>
</svg>

<div class="wrap">
  <div class="view" id="view-today" role="tabpanel" aria-labelledby="nav-today">
  <section class="page" aria-labelledby="dateTitle">
    <div class="today">
      <div class="big-seal" id="bigSeal" aria-hidden="true"><b id="bigNum">0</b><small id="sealLabel">오늘 도장</small></div>
      <div>
        <h1 id="dateTitle">10월 20일 화요일</h1>
        <p class="msg" id="msg"></p>
      </div>
    </div>
    <div class="week" id="week" aria-label="이번 주 도장"></div>
  </section>

  <section class="page" aria-labelledby="listTitle">
    <div class="list-head">
      <h2 id="listTitle">오늘 할 일</h2>
      <button class="new-cat-btn" id="newCatBtn" type="button" aria-expanded="false" aria-controls="catForm"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>새 카테고리</button>
    </div>
    <form class="newcat" id="catForm" autocomplete="off" hidden>
      <label class="sr" for="newCat">새 카테고리 이름</label>
      <input id="newCat" placeholder="카테고리 이름 (예: 업무, 집안일)" maxlength="20">
      <button class="btn" id="catBtn" type="submit" disabled>만들기</button>
    </form>
    <div class="cats" id="cats"></div>
  </section>
  </div>
  <div class="view" id="view-graph" role="tabpanel" aria-labelledby="nav-graph" hidden>
    <section class="page" data-chart="days" aria-labelledby="t-days">
      <div class="list-head"><h2 id="t-days">이번 주</h2><span class="count" id="r-days"></span></div>
      <p class="chart-sum" id="s-days"></p>
      <div class="legend-row" aria-hidden="true"></div>
      <div class="chart"><svg role="img" aria-labelledby="t-days"></svg><div class="tip" hidden></div></div>
      <table class="sr"></table>
    </section>

    <section class="page" data-chart="weeks" aria-labelledby="t-weeks">
      <div class="list-head"><h2 id="t-weeks">주별</h2>
        <div class="seg" id="weekSpan" role="radiogroup" aria-label="보는 기간">
          <button type="button" role="radio" data-span="4" aria-selected="true" aria-checked="true">4주</button>
          <button type="button" role="radio" data-span="8" aria-selected="false" aria-checked="false">8주</button>
          <button type="button" role="radio" data-span="12" aria-selected="false" aria-checked="false">12주</button>
        </div>
      </div>
      <p class="chart-sum" id="s-weeks"></p>
      <div class="legend-row" aria-hidden="true"></div>
      <div class="chart"><svg role="img" aria-labelledby="t-weeks"></svg><div class="tip" hidden></div></div>
      <table class="sr"></table>
    </section>

    <section class="page" data-chart="month" aria-labelledby="t-month">
      <div class="list-head">
        <h2 id="t-month">한 달</h2>
        <div class="month-nav">
          <button type="button" id="prevM" aria-label="이전 달">‹</button>
          <span id="monthLabel"></span>
          <button type="button" id="nextM" aria-label="다음 달">›</button>
        </div>
      </div>
      <p class="chart-sum" id="s-month"></p>
      <div class="legend-row" aria-hidden="true"></div>
      <div class="chart"><svg role="img" aria-labelledby="t-month"></svg><div class="tip" hidden></div></div>
      <table class="sr"></table>
    </section>

    <section class="page" aria-labelledby="t-year">
      <div class="list-head"><h2 id="t-year">1년 기록</h2><span class="count">많이 할수록 진해져요</span></div>
      <p class="chart-sum" id="s-year"></p>
      <div class="heat-wrap" id="heatWrap"><div class="heat" id="heat" role="img" aria-labelledby="s-year"></div></div>
      <div class="heat-legend" aria-hidden="true">적음 <i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i> 많음</div>
    </section>
  </div>
  <div class="view" id="view-settings" role="tabpanel" aria-labelledby="nav-settings" hidden>
    <section class="page" aria-labelledby="t-theme">
      <h2 id="t-theme">화면 모드</h2>
      <div class="opt-row" id="themeOpts" role="radiogroup" aria-labelledby="t-theme">
        <button type="button" class="opt" role="radio" data-theme-opt="system" aria-checked="true"><span class="opt-prev sys" aria-hidden="true"></span>기기 설정대로</button>
        <button type="button" class="opt" role="radio" data-theme-opt="light" aria-checked="false"><span class="opt-prev lt" aria-hidden="true"></span>화이트 모드</button>
        <button type="button" class="opt" role="radio" data-theme-opt="dark" aria-checked="false"><span class="opt-prev dk" aria-hidden="true"></span>다크 모드</button>
      </div>
    </section>
    <section class="page" aria-labelledby="t-heatc">
      <h2 id="t-heatc">1년 기록 색상</h2>
      <div class="opt-list" id="heatOpts" role="radiogroup" aria-labelledby="t-heatc"></div>
    </section>
    <section class="page" aria-labelledby="t-backup">
      <h2 id="t-backup">기록 백업</h2>
      <p class="note">기록은 이 휴대폰에만 저장돼요. 가끔 파일로 내보내 두면 폰을 바꿔도 그대로 옮길 수 있어요.</p>
      <div class="backup-row">
        <button type="button" class="opt" id="exportBtn">기록 내보내기</button>
        <label class="opt" for="importFile">기록 가져오기</label>
        <input type="file" id="importFile" accept="application/json,.json" class="sr">
      </div>
      <p class="note" id="backupMsg" role="status"></p>
    </section>
    <p class="note">카테고리 색은 오늘 탭에서 카테고리 이름을 누르면 바꿀 수 있어요.</p>
  </div>
  <span class="sr" id="live" role="status"></span>
</div>
<nav class="tabbar" aria-label="화면"><div role="tablist">
  <button type="button" role="tab" id="nav-today" data-go="today" aria-selected="true" aria-controls="view-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6"/><path d="M9.2 12.2l2 2 3.8-4.2"/></svg>오늘</button>
  <button type="button" role="tab" id="nav-graph" data-go="graph" aria-selected="false" aria-controls="view-graph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-7M10 20V6M15 20v-9M20 20V9"/><path d="M3 20h18" stroke-width="1.4"/></svg>그래프</button>
  <button type="button" role="tab" id="nav-settings" data-go="settings" aria-selected="false" aria-controls="view-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>설정</button>
</div></nav>

<script>
(function () {
  const KEY = "seongkwa-note-v2";
  const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const REP = { once: "오늘만", weekdays: "평일마다", daily: "매일" };
  const EASE = "cubic-bezier(.23, 1, .32, 1)";
  const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const TODAY = keyOf(today);
  const monday = addDays(today, -((today.getDay() + 6) % 7));
  // the day the checklist shows; tapping a day in the week strip moves it (today or earlier only)
  let viewDay = today, VIEW = TODAY;

  // cats: {id, name}  tasks: {id, text, rep, date, cat}  done: {"YYYY-MM-DD": [{id, text, cat}]}
  function sample() {
    const cats = [{ id: "c1", name: "업무" }, { id: "c2", name: "생활" }, { id: "c3", name: "건강" }];
    const t = [
      { id: "s2", text: "메일 확인하고 답장 하나 보내기", rep: "weekdays", cat: "c1" },
      { id: "s4", text: "주간 보고서 첫 문단 쓰기", rep: "once", date: TODAY, cat: "c1" },
      { id: "s5", text: "팀장님께 일정 공유", rep: "once", date: TODAY, cat: "c1" },
      { id: "s3", text: "책상 위 5분 정리", rep: "weekdays", cat: "c2" },
      { id: "s1", text: "물 한 잔 마시고 시작하기", rep: "daily", cat: "c3" },
      { id: "s6", text: "10분 걷기", rep: "daily", cat: "c3" }
    ];
    const st = { cats, tasks: t, done: {}, collapsed: {} };
    return st;
  }

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.tasks)) state = sample();
  // notes saved before categories existed: put everything in one category
  if (!Array.isArray(state.cats)) {
    state.cats = state.tasks.length ? [{ id: "c0", name: "할 일" }] : [];
    state.tasks.forEach(t => t.cat = "c0");
  }
  state.collapsed = state.collapsed || {};
  // each category keeps its color for life, so deleting one never repaints the others
  function freeColor() { const used = new Set(state.cats.map(c => c.color)); for (let i = 0; i < 8; i++) if (!used.has(i)) return i; return state.cats.length % 8; }
  state.cats.forEach(c => { if (typeof c.color !== "number") c.color = freeColor(); });
  // earlier versions filled the graphs with made-up history; drop it (only the example tasks' past days)
  if (state.sample) {
    const ex = new Set(["s1", "s2", "s3", "s4", "s5", "s6"]);
    Object.keys(state.done).forEach(k => {
      if (k >= TODAY) return;
      state.done[k] = state.done[k].filter(x => !ex.has(x.id));
      if (!state.done[k].length) delete state.done[k];
    });
    delete state.sample; delete state.hist;
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const catName = id => (state.cats.find(c => c.id === id) || {}).name || "";
  const doneOn = k => state.done[k] || [];
  const isDone = (id, k = VIEW) => doneOn(k).some(x => x.id === id);
  function todaysTasks(cat) {
    const wd = viewDay.getDay(), weekday = wd > 0 && wd < 6;
    return state.tasks.filter(t => (cat === undefined || t.cat === cat) && (
      t.rep === "daily" || (t.rep === "weekdays" && weekday) || (t.rep === "days" && t.days.includes(wd)) ||
      // a one-off stays on the list until it is done, then disappears the next day
      // a one-off shows from its date until the day it was done
      (t.rep === "once" && t.date <= VIEW && (!t.doneAt || t.doneAt >= VIEW))));
  }

  let selDays = [];     // getDay() numbers picked in the open input box; none means a one-off for today
  const WEEK = [1, 2, 3, 4, 5, 6, 0];
  function repLabel(t) {
    if (t.rep === "once") return t.date < VIEW ? "이어서 하는 일" : "한 번";
    const days = t.rep === "daily" ? WEEK : t.rep === "weekdays" ? [1, 2, 3, 4, 5] : WEEK.filter(d => t.days.includes(d));
    if (days.length === 7) return "매일";
    if (days.length === 5 && !days.includes(0) && !days.includes(6)) return "평일마다";
    return days.map(d => DAYS[d]).join(" ") + "요일마다";
  }
  let armed = null;
  let openAdd = null;   // the category whose input box is open
  let editTask = null, editCat = null;

  const CHECK_SVG = `<svg viewBox="0 0 30 30" aria-hidden="true"><g filter="url(#rough)">
    <circle cx="15" cy="15" r="13" fill="none" stroke="var(--seal)" stroke-width="2.4"/>
    <circle cx="15" cy="15" r="9.5" fill="none" stroke="var(--seal)" stroke-width="1"/>
    <path d="M10 15.5l3.4 3.3L20.5 11" fill="none" stroke="var(--seal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;

  function renderToday(bump) {
    const n = doneOn(VIEW).length, list = todaysTasks(), left = list.filter(t => !isDone(t.id)).length, isToday = VIEW === TODAY;
    $("dateTitle").textContent = `${viewDay.getMonth() + 1}월 ${viewDay.getDate()}일 ${DAYS[viewDay.getDay()]}요일`;
    $("sealLabel").textContent = isToday ? "오늘 도장" : "그날 도장";
    $("listTitle").textContent = isToday ? "오늘 할 일" : `${DAYS[viewDay.getDay()]}요일 할 일`;
    if (!isToday) {
      $("msg").textContent = "지난 날의 체크를 고치고 있어요. ";
      const back = document.createElement("button");
      back.type = "button"; back.className = "text-btn"; back.dataset.day = TODAY; back.textContent = "오늘로 돌아가기";
      $("msg").appendChild(back);
      return bumpSeal(bump);
    }
    $("bigNum").textContent = n;
    $("bigSeal").classList.toggle("zero", !n);
    $("msg").innerHTML = "";
    if (list.length && !left) {
      const s = document.createElement("span"); s.className = "all-done"; s.textContent = "오늘 할 일을 다 했어요";
      $("msg").appendChild(s);
    } else {
      $("msg").textContent = !n ? "하나만 눌러도 도장이 찍혀요." : `남은 할 일 ${left}개. 지금 하나만 골라 보세요.`;
    }
    bumpSeal(bump);
  }
  function bumpSeal(bump) {
    if (bump && !reduce()) {
      $("bigSeal").animate([{ transform: "rotate(-7deg) scale(1.08)" }, { transform: "rotate(-7deg) scale(1)" }], { duration: 220, easing: EASE });
      $("bigNum").animate([{ opacity: 0, transform: "translateY(-30%)", filter: "blur(2px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 200, easing: EASE });
    }
  }

  function renderWeek() {
    const w = $("week"); w.innerHTML = "";
    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i), k = keyOf(d), n = doneOn(k).length;
      const el = document.createElement("button");
      el.type = "button"; el.dataset.day = k; el.disabled = k > TODAY;
      el.setAttribute("aria-pressed", String(k === VIEW));
      el.className = "day" + (k === TODAY ? " is-today" : "") + (k === VIEW ? " is-sel" : "") + (k > TODAY ? " later" : "");
      el.innerHTML = `<span>${DAYS[d.getDay()]}</span><span class="s${n ? " on" : ""}" style="--r:${(i * 37 % 15) - 7}deg">${n || ""}</span>`;
      el.setAttribute("aria-label", `${DAYS[d.getDay()]}요일 ${n ? "도장 " + n + "개" : "도장 없음"}${k <= TODAY ? ", 눌러서 그날 체크 고치기" : ""}`);
      w.appendChild(el);
    }
  }

  function countText(cat) {
    const list = todaysTasks(cat);
    return { done: list.filter(t => isDone(t.id)).length, all: list.length };
  }

  function taskRow(t) {
    const li = document.createElement("li");
    li.dataset.id = t.id;
    if (editTask === t.id) { li.className = "editing"; li.appendChild(taskForm(t)); return li; }
    const done = isDone(t.id);
    li.classList.toggle("is-done", done);
    const box = document.createElement("button");
    box.type = "button"; box.className = "box-btn"; box.dataset.check = t.id;
    box.setAttribute("aria-pressed", String(done));
    box.setAttribute("aria-label", `${t.text} 완료`);
    box.innerHTML = `<span class="box">${CHECK_SVG}</span>`;
    const title = document.createElement("button");
    title.type = "button"; title.className = "title-btn"; title.dataset.edit = t.id;
    title.innerHTML = `<span class="txt"><span></span><small class="rep${t.rep === "once" ? " once" : ""}"></small></span>`;
    title.querySelector(".txt span").textContent = t.text;
    title.querySelector(".rep").textContent = repLabel(t);
    title.setAttribute("aria-label", `${t.text} 고치기`);
    li.append(box, title);
    return li;
  }

  function chipsHTML() {
    const all = selDays.length === 7;
    return WEEK.map(d => `<button type="button" class="day-btn" data-day="${d}" aria-pressed="${selDays.includes(d)}" aria-label="${DAYS[d]}요일마다">${DAYS[d]}</button>`).join("") +
      `<button type="button" class="day-btn every" data-day="all" aria-pressed="${all}">매일</button>`;
  }

  // the same box serves adding (mode add) and changing an existing task (mode task)
  function taskForm(t, catId) {
    const f = document.createElement("form");
    f.className = "cat-add"; f.autocomplete = "off";
    f.dataset.mode = t ? "task" : "add"; f.dataset.cat = t ? t.cat : catId;
    if (t) f.dataset.id = t.id;
    const lid = "rl-" + (t ? t.id : catId);

  // ---- graphs ----
  let monthOff = 0;

  // segments per category, in the categories' fixed order; done items from deleted categories fold into "지운 카테고리"
  function segsFor(keys) {
    const counts = {};
    keys.forEach(k => doneOn(k).forEach(x => { const id = catName(x.cat) ? x.cat : "_gone"; counts[id] = (counts[id] || 0) + 1; }));
    const segs = state.cats.filter(c => counts[c.id]).map(c => ({ cat: c.id, name: c.name, color: c.color, n: counts[c.id] }));
    if (counts._gone) segs.push({ cat: "_gone", name: "지운 카테고리", color: -1, n: counts._gone });
    return segs;
  }
  const colorVar = i => i < 0 ? "var(--c0)" : `var(--c${(i % 8) + 1})`;

  function dayData() {
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(monday, i), k = keyOf(d);
      out.push({ label: DAYS[d.getDay()], full: `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`, n: doneOn(k).length, segs: segsFor([k]), cur: k === TODAY, future: k > TODAY, tick: true });
    }
    return out;
  }
  function weekData() {
    const out = [];
    for (let i = weekSpan - 1; i >= 0; i--) {
      const m = addDays(monday, -7 * i), keys = [];
      for (let j = 0; j < 7; j++) keys.push(keyOf(addDays(m, j)));
      out.push({ label: i ? `${m.getMonth() + 1}/${m.getDate()}` : "이번 주", full: i ? `${m.getMonth() + 1}월 ${m.getDate()}일부터 한 주` : "이번 주",
        n: keys.reduce((a, k) => a + doneOn(k).length, 0), segs: segsFor(keys), cur: !i, tick: weekSpan <= 8 || i % 2 === 0 });
    }
    return out;
  }
  function monthData() {
    const base = new Date(today.getFullYear(), today.getMonth() + monthOff, 1);
    const y = base.getFullYear(), m = base.getMonth(), last = new Date(y, m + 1, 0).getDate();
    const out = [];
    for (let d = 1; d <= last; d++) {
      const dt = new Date(y, m, d), k = keyOf(dt);
      out.push({ label: String(d), full: `${m + 1}월 ${d}일 ${DAYS[dt.getDay()]}요일`, n: doneOn(k).length, segs: segsFor([k]), cur: k === TODAY, future: k > TODAY, tick: d === 1 || d % 5 === 0 || k === TODAY });
    }
    return { base, out };
  }

  const charts = {};
  function setupChart(key) {
    const el = document.querySelector(`[data-chart="${key}"]`);
    const c = { key, el, box: el.querySelector(".chart"), svg: el.querySelector("svg"), tip: el.querySelector(".tip"), table: el.querySelector("table"), legend: el.querySelector(".legend-row"), lastKey: null, w: 0 };
    c.svg.addEventListener("pointermove", ev => { const h = ev.target.closest(".hit"); h ? showTip(c, +h.dataset.i) : hideTip(c); });
    c.svg.addEventListener("click", ev => { const h = ev.target.closest(".hit"); if (h) showTip(c, +h.dataset.i); });

  // labelAll: write the total on every bar (the 7-day chart); otherwise only on today/this week and the peak
  function draw(c, data, viewKey, labelAll) {
    const grow = c.lastKey !== viewKey && c.box.clientWidth > 0;
    if (c.box.clientWidth > 0) c.lastKey = viewKey;
    const W = Math.max(280, Math.round(c.box.clientWidth || 560)), H = labelAll ? 180 : 200, L = 28, R = 4, T = 20, B = 24, pw = W - L - R, ph = H - T - B;
    const max = Math.max(...data.map(d => d.n), 0);
    const stepV = max <= 4 ? 2 : max <= 10 ? 5 : max <= 20 ? 10 : Math.ceil(max / 20) * 10;
    const top = Math.max(stepV, Math.ceil(max / stepV) * stepV);
    const y = v => T + ph - (v / top) * ph;
    const band = pw / data.length, bw = Math.max(3, Math.min(band - 2, band * (data.length > 10 ? .7 : .52)));
    const gap = 0;
    let g = "";
    for (let v = 0; v <= top; v += stepV) {
      g += `<line class="${v ? "grid" : "base"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`;
      g += `<text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    }
    const peak = data.reduce((a, d, i) => d.n > data[a].n ? i : a, 0);
    data.forEach((d, i) => {
      const cx = L + band * i + band / 2, x = cx - bw / 2;
      if (d.n > 0) {
        let acc = 0, col = `<g class="col" data-i="${i}">`;
        d.segs.forEach((s, j) => {
          const y0 = y(acc), y1 = y(acc + s.n), last = j === d.segs.length - 1;
          const yb = acc ? y0 - gap : y0;                 // segments sit flush, as asked
          const r = last ? Math.min(4, bw / 2, yb - y1) : 0;
          if (yb - y1 > 0.5) col += `<path fill="${colorVar(s.color)}" d="M${x},${yb}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${yb}Z"/>`;
          acc += s.n;
        });
        g += col + "</g>";
        if (labelAll || d.cur || (i === peak && !data.some(o => o.cur && o.n === d.n)))
          g += `<text class="val" x="${cx}" y="${y(d.n) - 6}" text-anchor="middle">${d.n}</text>`;
      } else if (labelAll && !d.future) {
        g += `<text class="axis" x="${cx}" y="${y(0) - 6}" text-anchor="middle">0</text>`;
      }
      if (d.tick) g += `<text class="axis${d.cur ? " cur" : ""}" x="${cx}" y="${H - 6}" text-anchor="middle">${d.label}</text>`;
    });
    data.forEach((d, i) => { if (!d.future) g += `<rect class="hit" data-i="${i}" x="${L + band * i}" y="${T}" width="${band}" height="${ph}"/>`; });
    c.svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    c.svg.innerHTML = g;
    c.data = data; c.geo = { L, band, y, W };
    if (grow && !reduce()) c.svg.querySelectorAll(".col").forEach((b, i) =>
      b.animate([{ transform: "scaleY(.6)", opacity: 0 }, { transform: "scaleY(1)" }], { duration: 240, delay: Math.min(i, 10) * 12, easing: EASE, fill: "backwards" }));
    c.table.innerHTML = data.filter(d => !d.future).map(d =>
      `<tr><th>${d.full}</th><td>${d.n}개${d.segs.length ? " (" + d.segs.map(s => `${s.name} ${s.n}`).join(", ") + ")" : ""}</td></tr>`).join("");
    // legend: every category, in fixed order, even with nothing done yet; deleted ones only when they appear
    const seen = new Map();
    data.forEach(d => d.segs.forEach(s => seen.set(s.cat, s)));
    const entries = state.cats.map(x => ({ name: x.name, color: x.color }));
    if (seen.has("_gone")) entries.push(seen.get("_gone"));
    c.legend.innerHTML = "";
    entries.forEach(s => {
      const item = document.createElement("span");
      item.innerHTML = `<i style="background:${colorVar(s.color)}"></i>`;
      item.append(s.name);
      c.legend.appendChild(item);
    });
  }

  function renderChart() {
    if (!charts.days) return;
    Object.values(charts).forEach(hideTip);
    const days = dayData(), sun = addDays(monday, 6);
    $("r-days").textContent = `${monday.getMonth() + 1}/${monday.getDate()} – ${sun.getMonth() + 1}/${sun.getDate()}`;
    $("s-days").innerHTML = `이번 주에 지킨 할 일 <b>${sumOf(days)}</b>개. 오늘은 ${doneOn(TODAY).length}개.`;
    draw(charts.days, days, "days", true);

    const weeks = weekData();
    $("s-weeks").innerHTML = `${weekSpan}주 동안 모두 <b>${sumOf(weeks)}</b>개.`;
    draw(charts.weeks, weeks, "weeks" + weekSpan);

    const { base, out } = monthData();
    const past = out.filter(d => !d.future);
    $("monthLabel").textContent = `${base.getFullYear()}년 ${base.getMonth() + 1}월`;
    $("nextM").disabled = monthOff >= 0;
    $("s-month").innerHTML = `${base.getMonth() + 1}월에 해낸 일 <b>${sumOf(past)}</b>개, 도장 찍은 날 ${past.filter(d => d.n).length}일.`;
    draw(charts.month, out, "month" + monthOff);
    renderHeat();
  }

  function hideTip(c) { c.tip.hidden = true; c.svg.classList.remove("hovering"); c.svg.querySelectorAll(".col.on").forEach(b => b.classList.remove("on")); }
  function showTip(c, i) {
    const d = c.data && c.data[i], g = c.geo;
    if (!d || d.future) return hideTip(c);
    c.svg.querySelectorAll(".col.on").forEach(b => b.classList.remove("on"));
    const col = c.svg.querySelector(`.col[data-i="${i}"]`);
    c.svg.classList.toggle("hovering", !!col);
    if (col) col.classList.add("on");
    const box = c.svg.getBoundingClientRect(), k = box.width / g.W;
    c.tip.innerHTML = `${d.full}<br><b>${d.n}</b>개 해냈어요`;
    d.segs.slice().reverse().forEach(s => {
      const row = document.createElement("span"); row.className = "tip-row";
      row.innerHTML = `<i style="background:${colorVar(s.color)}"></i>`;
      row.append(`${s.name} ${s.n}개`);
      c.tip.appendChild(row);
    });
    c.tip.hidden = false;
    const half = c.tip.offsetWidth / 2, cx = (g.L + g.band * i + g.band / 2) * k;
    c.tip.style.left = Math.min(Math.max(cx, half), box.width - half) + "px";
    c.tip.style.top = (g.y(d.n) * k - 8) + "px";
  }
  document.addEventListener("pointerdown", ev => { if (!ev.target.closest(".chart")) Object.values(charts).forEach(hideTip); });

  ["days", "weeks", "month"].forEach(setupChart);
  // ---- one-year grid ----
  const level = n => n <= 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : n <= 5 ? 3 : 4;
  let heatScrolled = false;
  function renderHeat() {
    const heat = $("heat"), start = addDays(monday, -52 * 7);
    heat.innerHTML = "";
    const add = (el, row, col) => { el.style.gridRow = row; el.style.gridColumn = col; heat.appendChild(el); };
    ["월", "", "수", "", "금", "", "일"].forEach((t, r) => { const d = document.createElement("span"); d.className = "dl"; d.textContent = t; add(d, r + 2, 1); });
    let total = 0, days = 0, lastLabel = -9;
    for (let w = 0; w <= 52; w++) {
      const wkStart = addDays(start, w * 7);
      // month label where a new month begins, if there is room since the last one
      const first = w === 0 || addDays(wkStart, -1).getMonth() !== addDays(wkStart, 6).getMonth() || wkStart.getDate() === 1;
      if (first && w - lastLabel >= 3) {
        const m = document.createElement("span"); m.className = "ml";
        const md0 = wkStart.getDate() <= 7 || w === 0 ? wkStart : addDays(wkStart, 6);
        m.textContent = `${md0.getMonth() + 1}월`;
        add(m, 1, `${w + 2} / span 3`); lastLabel = w;
      }
      for (let r = 0; r < 7; r++) {
        const d = addDays(wkStart, r), k = keyOf(d);
        if (k > TODAY) continue;
        const n = doneOn(k).length;
        total += n; if (n) days++;
        const c = document.createElement("span");
        c.className = `c h${level(n)}` + (k === TODAY ? " now" : "");
        c.dataset.k = k; c.dataset.n = n;
        add(c, r + 2, w + 2);
      }
    }
    $("s-year").innerHTML = `최근 1년 동안 해낸 일 <b>${total}</b>개, 도장 찍은 날 ${days}일.`;
    if (!heatScrolled && $("heatWrap").clientWidth) { $("heatWrap").scrollLeft = $("heatWrap").scrollWidth; heatScrolled = true; }
  }
  $("heat").addEventListener("click", ev => {
    const c = ev.target.closest(".c");
    const heat = $("heat");
    heat.querySelectorAll(".c.on").forEach(x => x.classList.remove("on"));
    heat.querySelectorAll(".tip").forEach(x => x.remove());
    if (!c) return;
    c.classList.add("on");
    const [y, m, d] = c.dataset.k.split("-").map(Number), dt = new Date(y, m - 1, d);
    const tip = document.createElement("div"); tip.className = "tip";
    tip.innerHTML = `${m}월 ${d}일 ${DAYS[dt.getDay()]}요일<br><b>${c.dataset.n}</b>개 해냈어요`;
    heat.appendChild(tip);
    const half = tip.offsetWidth / 2, cx = c.offsetLeft + c.offsetWidth / 2;
    const wrap = $("heatWrap"), minX = wrap.scrollLeft + half, maxX = wrap.scrollLeft + wrap.clientWidth - half;
    tip.style.left = Math.min(Math.max(cx, minX), maxX) + "px";
    tip.style.top = (c.offsetTop - 6) + "px";
  });
  document.addEventListener("pointerdown", ev => { if (!ev.target.closest("#heat")) { $("heat").querySelectorAll(".tip").forEach(x => x.remove()); $("heat").querySelectorAll(".c.on").forEach(x => x.classList.remove("on")); } });

  let weekSpan = 4;
  $("weekSpan").addEventListener("click", ev => {
    const b = ev.target.closest("[data-span]");
    if (!b) return;
    weekSpan = +b.dataset.span;
    $("weekSpan").querySelectorAll("[data-span]").forEach(x => { const on = x === b; x.setAttribute("aria-selected", String(on)); x.setAttribute("aria-checked", String(on)); });
    renderChart();
  });
  $("prevM").addEventListener("click", () => { monthOff--; renderChart(); });
  $("nextM").addEventListener("click", () => { if (monthOff < 0) { monthOff++; renderChart(); } });

  // tap a day (or "오늘로 돌아가기") to check off that day's list
  function showDay(k) {
    if (!k || k > TODAY || k === VIEW) return;
    VIEW = k;
    const [y, m, d] = k.split("-").map(Number);
    viewDay = new Date(y, m - 1, d);
    openAdd = editTask = editCat = null; selDays = [];
    renderToday(); renderWeek(); renderCats();
    $("live").textContent = `${viewDay.getMonth() + 1}월 ${viewDay.getDate()}일 할 일을 보고 있어요`;
  }
  $("view-today").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-day]");
    if (b && !b.closest(".cat-add")) showDay(b.dataset.day);
  });

  // two screens, switched from the bottom bar without animation since it is used constantly
  function go(v) {
    document.querySelectorAll(".view").forEach(x => x.hidden = x.id !== "view-" + v);
    document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.go === v)));
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + v); } catch (e) {}
  }
  document.querySelectorAll(".tabbar button").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));

  // ---- settings: screen mode and the one-year grid colour, kept with the notes ----
  const HEATS = [
    { id: "seal", name: "인주 빨강", v: null },
    { id: "green", name: "잔디 초록", v: "#2da44e" },
    { id: "blue", name: "바다 파랑", v: "#2a78d6" },
    { id: "violet", name: "보라", v: "#6250d6" },
    { id: "orange", name: "주황", v: "#eb6834" }
  ];
  state.settings = state.settings || { theme: "system", heat: "seal" };
  function applySettings() {
    const st = state.settings, root = document.documentElement;
    if (st.theme === "system") delete root.dataset.theme; else root.dataset.theme = st.theme;
    const h = HEATS.find(x => x.id === st.heat) || HEATS[0];
    if (h.v) root.style.setProperty("--heat", h.v); else root.style.removeProperty("--heat");
    document.querySelectorAll("[data-theme-opt]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.themeOpt === st.theme)));
    document.querySelectorAll("[data-heat]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.heat === h.id)));
  }
  $("heatOpts").innerHTML = HEATS.map(h => {
    const c = h.v || "var(--seal)";
    const ramp = [28, 52, 76].map(p => `<i style="background:color-mix(in oklab, ${c} ${p}%, var(--sheet))"></i>`).join("") + `<i style="background:${c}"></i>`;
    return `<button type="button" class="heat-opt" role="radio" data-heat="${h.id}" aria-checked="false"><span class="name">${h.name}</span><span class="ramp" aria-hidden="true">${ramp}</span></button>`;
  }).join("");
  $("themeOpts").addEventListener("click", ev => {
    const b = ev.target.closest("[data-theme-opt]"); if (!b) return;
    state.settings.theme = b.dataset.themeOpt; save(); applySettings();
  });
  $("heatOpts").addEventListener("click", ev => {
    const b = ev.target.closest("[data-heat]"); if (!b) return;
    state.settings.heat = b.dataset.heat; save(); applySettings();
  });
  applySettings();

  // iPhone keyboard covers the lower half: while typing, move the open box to the middle of what is still visible
  function centerBox(box) {
    const vv = window.visualViewport;
    const h = vv ? vv.height : innerHeight, top = vv ? vv.offsetTop : 0;
    const r = box.getBoundingClientRect();
    const delta = r.height > h - 24 ? r.top - top - 12 : r.top + r.height / 2 - top - h / 2;
    if (Math.abs(delta) > 4) scrollBy({ top: delta, behavior: reduce() ? "auto" : "smooth" });
  }
  document.addEventListener("focusin", ev => {
    const inp = ev.target;
    if (!(inp instanceof HTMLInputElement) || inp.type === "file") return;
    const box = inp.closest(".cat-add, .newcat"); if (!box) return;
    document.body.classList.add("typing");
    let n = 0, last = -1;
    const vv = window.visualViewport;
    // the keyboard slides up over ~300ms; re-center until the visible height stops changing
    const tick = () => {
      if (document.activeElement !== inp || !box.isConnected) return;
      const h = vv ? vv.height : innerHeight;
      if (h !== last || n < 2) centerBox(box);
      last = h;
      if (++n < 8) setTimeout(tick, 120);
    };
    setTimeout(tick, 60);
  });
  document.addEventListener("focusout", () => setTimeout(() => {
    const a = document.activeElement;
    if (!(a && a.closest && a.closest(".cat-add, .newcat"))) document.body.classList.remove("typing");
  }, 100));

  // backup: the file is the whole state, so importing simply replaces it and reloads (load-time migration then runs on it)
  const backupMsg = t => { $("backupMsg").textContent = t; };
  $("exportBtn").addEventListener("click", async () => {
    const name = `seongkwa-note-${TODAY}.json`;
    const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
    const file = new File([blob], name, { type: "application/json" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        backupMsg("내보냈어요. '파일에 저장'을 고르면 아이폰 파일 앱에 보관돼요."); return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = name; a.hidden = true; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    backupMsg("내보냈어요.");
  });
  $("importFile").addEventListener("change", async ev => {
    const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) { data = null; }
    if (!data || !Array.isArray(data.tasks) || typeof data.done !== "object") { backupMsg("성과노트 백업 파일이 아니에요."); return; }
    const n = Object.values(data.done).reduce((a, d) => a + (Array.isArray(d) ? d.length : 0), 0);
    if (!confirm(`지금 기록을 지우고 백업(완료 ${n}개)으로 바꿀까요?`)) return;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { backupMsg("저장하지 못했어요."); return; }
    location.reload();
  });
  // ask the browser not to clear this note when space runs low
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  renderAll();
  if (location.hash === "#graph" || location.hash === "#settings") go(location.hash.slice(1));
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
